<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aesthetica - Sistema de Citas</title>
    <!-- Enlace a los estilos dentro de la carpeta styles -->
    <link rel="stylesheet" href="styles/styles.css">
</head>
<body>
    <div class="app-container">
        <!-- Encabezado con Flexbox -->
        <header>
            <nav class="navbar">
                <h1>Aesthetica</h1>
                <ul>
                    <li><a href="#servicios" style="color:white;">Servicios</a></li>
                    <li><a href="#citas" style="color:white;">Agendar Cita</a></li>
                </ul>
            </nav>
        </header>

        <!-- Contenido Principal con Grid y Flexbox -->
        <main>
            <section id="servicios">
                <h2>Nuestros Servicios</h2>
                <div class="services-grid">
                    <div class="card">
                        <h3>Manicura Spa</h3>
                        <p>Cuidado completo para tus manos con exfoliación e hidratación.</p>
                    </div>
                    <div class="card">
                        <h3>Diseño de Uñas</h3>
                        <p>Personalización profesional en gel y acrílico.</p>
                    </div>
                </div>
            </section>
        </main>

        <!-- Pie de página -->
        <footer>
            <p>&copy; 2026 Aesthetica - Todos los derechos reservados.</p>
        </footer>
    </div>
</body>
</html>
