<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Crear cuenta · Esthetica</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/estilos.css" rel="stylesheet">
</head>
<body>
  <main class="pantalla-auth">
    <section class="tarjeta-auth">
      <h1 class="marca">Crea tu cuenta</h1>
      <p class="marca-sub">Guarda tus datos y agenda más rápido.</p>

      <div id="aviso" role="alert"></div>

      <form id="form-registro" novalidate>
        <div class="mb-3">
          <label for="nombre" class="form-label">Nombre completo</label>
          <input type="text" class="form-control" id="nombre" autocomplete="name">
          <span class="mensaje-error" id="error-nombre"></span>
        </div>

        <div class="mb-3">
          <label for="correo" class="form-label">Correo</label>
          <input type="email" class="form-control" id="correo" placeholder="nombre@correo.com" autocomplete="email">
          <span class="mensaje-error" id="error-correo"></span>
        </div>

        <div class="mb-3">
          <label for="telefono" class="form-label">Teléfono</label>
          <input type="tel" class="form-control" id="telefono" placeholder="8 dígitos" autocomplete="tel">
          <span class="mensaje-error" id="error-telefono"></span>
        </div>

        <div class="mb-3">
          <label for="password" class="form-label">Contraseña</label>
          <input type="password" class="form-control" id="password" autocomplete="new-password">
          <span class="mensaje-error" id="error-password"></span>
        </div>

        <div class="mb-3">
          <label for="confirmar" class="form-label">Repite la contraseña</label>
          <input type="password" class="form-control" id="confirmar" autocomplete="new-password">
          <span class="mensaje-error" id="error-confirmar"></span>
        </div>

        <button type="submit" class="btn btn-salon w-100">Crear cuenta</button>
      </form>

      <p class="text-center mt-4 mb-0">
        ¿Ya tienes cuenta? <a href="index.html" class="enlace-salon">Inicia sesión</a>
      </p>
    </section>
  </main>

  <script src="js/auth.js"></script>
</body>
</html>
