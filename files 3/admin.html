<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Panel administrativo · Esthetica</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/estilos.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-lg barra-superior px-3">
    <span class="navbar-brand">Esthetica</span>
    <div class="ms-auto d-flex align-items-center gap-3">
      <span id="usuario-nombre"></span>
      <span class="badge badge-rol" id="usuario-rol"></span>
      <button id="btn-salir" class="btn btn-outline-light btn-sm">Cerrar sesión</button>
    </div>
  </nav>

  <main class="container py-4">
    <h1 class="h3 mb-1">Panel administrativo</h1>
    <p class="text-muted">Aquí se conectan los módulos de citas y servicios de tus compañeros.</p>

    <div class="row g-3 mt-2">
      <div class="col-12 col-md-6 col-lg-4">
        <div class="card h-100"><div class="card-body">
          <h2 class="h6">Usuarios registrados</h2>
          <p class="display-6 mb-0" id="total-usuarios">0</p>
        </div></div>
      </div>
      <div class="col-12 col-md-6 col-lg-4">
        <div class="card h-100"><div class="card-body">
          <h2 class="h6">Gestión de citas</h2>
          <p class="small text-muted">Módulo del Integrante 3.</p>
          <a href="#" class="enlace-salon">Abrir</a>
        </div></div>
      </div>
      <div class="col-12 col-md-6 col-lg-4">
        <div class="card h-100"><div class="card-body">
          <h2 class="h6">Servicios</h2>
          <p class="small text-muted">Módulo del Integrante 2.</p>
          <a href="#" class="enlace-salon">Abrir</a>
        </div></div>
      </div>
    </div>

    <h2 class="h5 mt-5">Cuentas del sistema</h2>
    <div class="table-responsive">
      <table class="table align-middle">
        <thead><tr><th>Nombre</th><th>Correo</th><th>Teléfono</th><th>Rol</th></tr></thead>
        <tbody id="tabla-usuarios"></tbody>
      </table>
    </div>
  </main>

  <script src="js/sesion.js"></script>
  <script>
    const sesion = protegerVista(["admin"]);
    if (sesion) {
      pintarUsuario(sesion);
      const usuarios = JSON.parse(localStorage.getItem("salon_usuarios")) || [];
      document.getElementById("total-usuarios").textContent = usuarios.length;
      document.getElementById("tabla-usuarios").innerHTML = usuarios
        .map(u => `<tr><td>${u.nombre}</td><td>${u.correo}</td><td>${u.telefono}</td><td>${u.rol}</td></tr>`)
        .join("");
    }
  </script>
</body>
</html>
